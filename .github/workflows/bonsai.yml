name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'   # re-grow daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: egorthinks/git-bonsai@v1
        with:
          user: Raghav2012Code
          commit: 'false'   # we commit below, after trimming

      - name: Trim the empty sky from the tree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          # union bounding box across every frame, so the crop is stable and animated
          convert output/bonsai.gif -coalesce -layers trim-bounds +repage output/_trim.gif
          mv output/_trim.gif output/bonsai.gif
          # static stills
          convert output/bonsai.png -trim +repage output/bonsai.png
          convert output/bonsai.gif -coalesce -layers trim-bounds +repage output/bonsai-growth.gif

      - name: Verify the trimmed tree is still animated and transparent
        run: |
          python3 - <<'PY'
          import struct
          d = open('output/bonsai.gif','rb').read()
          w, h = struct.unpack('<HH', d[6:10])
          frames = d.count(b'\x21\xf9\x04')
          packed = d[10]
          gct = bool(packed & 0x80)
          n = 2 ** ((packed & 7) + 1)
          trans = None
          i = 13 + (3*n if gct else 0)
          while i < len(d)-1:
              if d[i] == 0x21 and d[i+1] == 0xF9:
                  if d[i+3] & 0x01: trans = d[i+6]
                  break
              i += 1
          print(f'trimmed: {w}x{h}  frames={frames}  transparency_index={trans}')
          assert frames > 1, 'animation lost'
          assert trans is not None, 'transparency lost'
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: tend the bonsai" || exit 0
          git push
